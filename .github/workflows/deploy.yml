name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Add direct route fallbacks
        run: |
          mkdir -p dist/work dist/works dist/studio dist/process dist/gallery
          cp dist/index.html dist/work/index.html
          cp dist/index.html dist/works/index.html
          cp dist/index.html dist/studio/index.html
          cp dist/index.html dist/process/index.html
          cp dist/index.html dist/gallery/index.html

      - name: Verify production build
        run: |
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'Build is serving source files, not dist output.'
            exit 1
          fi
          if ! grep -q '/am/assets/' dist/index.html; then
            echo 'Build is missing /am/ asset prefix.'
            exit 1
          fi
          test -f dist/work/index.html
          test -f dist/studio/index.html
          test -f dist/process/index.html
          test -f dist/gallery/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
